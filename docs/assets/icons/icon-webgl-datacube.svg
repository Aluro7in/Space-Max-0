<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="WebGL 3D Hyperspectral Data Cube Icon">
  <defs>
    <linearGradient id="bg-cube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#04060C"/>
    </linearGradient>
    <linearGradient id="cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="cube-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="cube-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow-slice" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#bg-cube)" stroke="#1E293B" stroke-width="2"/>
  <path d="M 28 5 H 100" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Isometric Cube Faces -->
  <polygon points="64,22 100,41 64,60 28,41" fill="url(#cube-top)" stroke="#00F0FF" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="28,41 64,60 64,102 28,83" fill="url(#cube-left)" stroke="#38BDF8" stroke-width="1.6" stroke-linejoin="round"/>
  <polygon points="100,41 64,60 64,102 100,83" fill="url(#cube-right)" stroke="#00F0FF" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Internal Spectral Laser Slice Plane -->
  <polygon points="26,62 64,81 102,62 64,43" fill="#F59E0B" fill-opacity="0.25" stroke="#F59E0B" stroke-width="2" stroke-linejoin="round" filter="url(#glow-slice)"/>

  <!-- Volumetric Core Hotspots -->
  <circle cx="64" cy="62" r="6" fill="#FDE68A" filter="url(#glow-slice)"/>
  <circle cx="52" cy="56" r="2.2" fill="#00F0FF"/>
  <circle cx="77" cy="67" r="2.2" fill="#F43F5E"/>
  <circle cx="64" cy="48" r="2" fill="#FFFFFF"/>

  <!-- 102-Band Axis Pill -->
  <rect x="30" y="99" width="68" height="16" rx="5" fill="#090D18" stroke="#00F0FF" stroke-opacity="0.55" stroke-width="1"/>
  <text x="64" y="110" text-anchor="middle" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700">32×32×102</text>
</svg>
