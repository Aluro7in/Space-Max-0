<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Gemini AI Copilot Space Guide Icon">
  <defs>
    <linearGradient id="bg-gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#04060C"/>
    </linearGradient>
    <linearGradient id="gem-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow-gem" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#bg-gem)" stroke="#1E293B" stroke-width="2"/>
  <path d="M 28 5 H 100" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Orbital HUD Rings -->
  <circle cx="64" cy="58" r="35" fill="none" stroke="#A855F7" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6 4"/>
  <ellipse cx="64" cy="58" rx="42" ry="18" transform="rotate(-24 64 58)" fill="none" stroke="#00F0FF" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- 4-Point Gemini Mission Star -->
  <path d="M 64 26 Q 66 54 94 58 Q 66 62 64 90 Q 62 62 34 58 Q 62 54 64 26 Z" fill="url(#gem-star)" filter="url(#glow-gem)"/>

  <!-- Satellite Nodes -->
  <circle cx="96" cy="40" r="3.5" fill="#00F0FF" filter="url(#glow-gem)"/>
  <circle cx="32" cy="76" r="3" fill="#F59E0B"/>

  <rect x="24" y="99" width="80" height="16" rx="5" fill="#090D18" stroke="#A855F7" stroke-opacity="0.55" stroke-width="1"/>
  <text x="64" y="110" text-anchor="middle" fill="#E9D5FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" font-weight="700">GEMINI BFF</text>
</svg>
