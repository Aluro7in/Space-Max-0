<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Blink Comparator &amp; Kinematic Vector Icon">
  <defs>
    <linearGradient id="bg-blink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#04060C"/>
    </linearGradient>
    <linearGradient id="gold-vec" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="glow-blink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#bg-blink)" stroke="#1E293B" stroke-width="2"/>
  <path d="M 28 5 H 100" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Subtle Astrometry Grid -->
  <g stroke="#38BDF8" stroke-opacity="0.12" stroke-width="1">
    <line x1="36" y1="18" x2="36" y2="110"/>
    <line x1="64" y1="18" x2="64" y2="110"/>
    <line x1="92" y1="18" x2="92" y2="110"/>
    <line x1="18" y1="36" x2="110" y2="36"/>
    <line x1="18" y1="64" x2="110" y2="64"/>
    <line x1="18" y1="92" x2="110" y2="92"/>
  </g>

  <!-- Corner Brackets -->
  <g stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 22 34 V 22 H 34"/>
    <path d="M 94 22 H 106 V 34"/>
    <path d="M 22 94 V 106 H 34"/>
    <path d="M 94 106 H 106 V 94"/>
  </g>

  <!-- Epoch 1 Negative Anomaly (2000) -->
  <circle cx="38" cy="86" r="14" fill="#F43F5E" fill-opacity="0.12" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="38" cy="86" r="5" fill="#F43F5E" filter="url(#glow-blink)"/>

  <!-- Golden Kinematic Vector -->
  <line x1="42" y1="82" x2="83" y2="45" stroke="url(#gold-vec)" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round" filter="url(#glow-blink)"/>
  <polygon points="88,40 77,42 84,50" fill="#F59E0B" filter="url(#glow-blink)"/>

  <!-- Epoch 2 Positive Detection (2026) -->
  <circle cx="90" cy="38" r="15" fill="#00F0FF" fill-opacity="0.14" stroke="#00F0FF" stroke-width="1.8"/>
  <circle cx="90" cy="38" r="5.5" fill="#00F0FF" filter="url(#glow-blink)"/>
  <path d="M 90 19 V 26 M 90 50 V 57 M 71 38 H 78 M 102 38 H 109" stroke="#00F0FF" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Telemetry Label -->
  <rect x="34" y="96" width="60" height="16" rx="5" fill="#090D18" stroke="#F59E0B" stroke-opacity="0.55" stroke-width="1"/>
  <text x="64" y="107" text-anchor="middle" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700">μ &gt; 50 mas</text>
</svg>
